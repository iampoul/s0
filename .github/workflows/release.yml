name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify CLI version matches tag
        working-directory: packages/s0-cli
        run: |
          CLI_VERSION=$(swift build -c release --quiet 2>/dev/null && .build/release/s0 --version || echo "unknown")
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          if [ "$CLI_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::CLI version ($CLI_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Build universal binary
        working-directory: packages/s0-cli
        run: |
          swift build -c release --arch arm64 --arch x86_64
          strip .build/apple/Products/Release/s0

      - name: Package binary
        working-directory: packages/s0-cli
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p dist
          cp .build/apple/Products/Release/s0 dist/s0
          cd dist
          tar czf "s0-${VERSION}-universal-apple-darwin.tar.gz" s0
          shasum -a 256 "s0-${VERSION}-universal-apple-darwin.tar.gz" > "s0-${VERSION}-universal-apple-darwin.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/s0-cli/dist/s0-${{ steps.version.outputs.VERSION }}-universal-apple-darwin.tar.gz
            packages/s0-cli/dist/s0-${{ steps.version.outputs.VERSION }}-universal-apple-darwin.tar.gz.sha256

      - name: Output Homebrew formula update info
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SHA256=$(cat packages/s0-cli/dist/s0-${VERSION}-universal-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          echo "## Homebrew Formula Update"
          echo "Update \`Formula/s0.rb\` in the \`homebrew-s0\` tap repo:"
          echo ""
          echo "  url: https://github.com/iampoul/s0/releases/download/v${VERSION}/s0-${VERSION}-universal-apple-darwin.tar.gz"
          echo "  sha256: ${SHA256}"
          echo "  version: ${VERSION}"

      - name: Update Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SHA256=$(cat packages/s0-cli/dist/s0-${VERSION}-universal-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          URL="https://github.com/iampoul/s0/releases/download/v${VERSION}/s0-${VERSION}-universal-apple-darwin.tar.gz"

          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/iampoul/homebrew-s0.git /tmp/homebrew-s0
          mkdir -p /tmp/homebrew-s0/Formula

          cat > /tmp/homebrew-s0/Formula/s0.rb << EOF
          class S0 < Formula
            desc "A code-first SwiftUI component kit for Apple platforms"
            homepage "https://github.com/iampoul/s0"
            url "${URL}"
            sha256 "${SHA256}"
            version "${VERSION}"
            license "MIT"

            depends_on :macos

            def install
              bin.install "s0"
            end

            test do
              assert_match "${VERSION}", shell_output("\#{bin}/s0 --version")
            end
          end
          EOF

          cd /tmp/homebrew-s0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/s0.rb
          git commit -m "Update s0 to ${VERSION}" || echo "No changes to commit"
          git push

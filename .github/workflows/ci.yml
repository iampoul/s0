name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the monorepo changed so we only run
  # the jobs that are relevant. Pushes to main always run everything.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.check.outputs.cli }}
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed paths
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Pushes to main — always run everything
            echo "cli=true"  >> "$GITHUB_OUTPUT"
            echo "web=true"  >> "$GITHUB_OUTPUT"
          else
            BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
            CHANGED=$(git diff --name-only "$BASE" "$HEAD")

            if echo "$CHANGED" | grep -qE '^(packages/s0-cli/|registry/|registry\.json)'; then
              echo "cli=true"  >> "$GITHUB_OUTPUT"
            else
              echo "cli=false" >> "$GITHUB_OUTPUT"
              echo "ℹ No CLI/registry changes — CLI job will be skipped"
            fi

            if echo "$CHANGED" | grep -qE '^(apps/web/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)'; then
              echo "web=true"  >> "$GITHUB_OUTPUT"
            else
              echo "web=false" >> "$GITHUB_OUTPUT"
              echo "ℹ No web changes — Web job will be skipped"
            fi
          fi

  cli-build-and-test:
    name: CLI — Build & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.cli == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI
        working-directory: packages/s0-cli
        run: swift build

      - name: Run CLI tests
        working-directory: packages/s0-cli
        run: swift test

  web-build-and-test:
    name: Web — Build & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        working-directory: apps/web
        run: pnpm test

      - name: Build website
        working-directory: apps/web
        run: pnpm build
